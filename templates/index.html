<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction - Bengaluru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .result.success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .result.error {
            background: #ffebee;
            border: 2px solid #f44336;
        }

        .result-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .result.success .result-title {
            color: #2e7d32;
        }

        .result.error .result-title {
            color: #c62828;
        }

        .result-price {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result.success .result-price {
            color: #1b5e20;
        }

        .result.error .result-price {
            color: #b71c1c;
        }

        .result-details {
            font-size: 13px;
            line-height: 1.8;
        }

        .result.success .result-details {
            color: #2e7d32;
        }

        .result.error .result-details {
            color: #c62828;
        }

        .input-summary {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .input-summary-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .input-summary-item:last-child {
            border-bottom: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .form-group.error input,
        .form-group.error select {
            border-color: #f44336;
        }

        .form-group.error .error-message {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .result-price {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏠 House Price Prediction</h1>
            <p>Bengaluru Real Estate Market Analysis</p>
        </div>

        <form id="predictionForm">
            <div class="form-group">
                <label for="location">📍 Location</label>
                <select id="location" name="location" required>
                    <option value="">-- Select Location --</option>
                </select>
                <div class="error-message">Please select a location</div>
            </div>

            <div class="form-group">
                <label for="bhk">🛏️ BHK (Bedrooms)</label>
                <input type="number" id="bhk" name="bhk" min="1" max="20" value="3" required>
                <div class="error-message">BHK should be between 1 and 20</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="total_sqft">📐 Total Area (Sqft)</label>
                    <input type="number" id="total_sqft" name="total_sqft" min="300" max="30000" value="1500" required>
                    <div class="error-message">Area should be between 300 and 30000 sqft</div>
                </div>

                <div class="form-group">
                    <label for="bath">🚿 Bathrooms</label>
                    <input type="number" id="bath" name="bath" min="1" max="15" value="2" required>
                    <div class="error-message">Bathrooms should be between 1 and 15</div>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="balcony" name="balcony">
                    <label for="balcony" style="margin-bottom: 0;">🌳 Has Balcony?</label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-predict">Predict Price</button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #667eea;">Calculating price...</p>
            </div>
        </form>

        <div class="result" id="result">
            <div class="result-title" id="resultTitle">Predicted Price</div>
            <div class="result-price" id="resultPrice">-</div>
            <div class="input-summary" id="inputSummary"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const locationSelect = document.getElementById('location');

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('http://localhost:5000/api/locations');
                const data = await response.json();
                
                data.locations.forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location;
                    locationSelect.appendChild(option);
                });
                
                if (data.locations.length > 0) {
                    locationSelect.value = data.locations[0];
                }
            } catch (error) {
                console.error('Error loading locations:', error);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }

            const formData = {
                location: document.getElementById('location').value,
                total_sqft: document.getElementById('total_sqft').value,
                bhk: document.getElementById('bhk').value,
                bath: document.getElementById('bath').value,
                balcony: document.getElementById('balcony').checked ? 1 : 0
            };

            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showSuccessResult(data);
                } else {
                    showErrorResult(data.error || 'Prediction failed');
                }
            } catch (error) {
                showErrorResult('Error: ' + error.message);
            } finally {
                loadingDiv.style.display = 'none';
            }
        });

        function validateForm() {
            let isValid = true;
            const fields = ['location', 'bhk', 'total_sqft', 'bath'];

            fields.forEach(field => {
                const input = document.getElementById(field);
                const formGroup = input.closest('.form-group');
                
                let valid = true;
                if (field === 'location' && !input.value) {
                    valid = false;
                } else if (field === 'bhk') {
                    const value = parseInt(input.value);
                    valid = value >= 1 && value <= 20;
                } else if (field === 'total_sqft') {
                    const value = parseInt(input.value);
                    valid = value >= 300 && value <= 30000;
                } else if (field === 'bath') {
                    const value = parseInt(input.value);
                    valid = value >= 1 && value <= 15;
                }

                if (valid) {
                    formGroup.classList.remove('error');
                } else {
                    formGroup.classList.add('error');
                    isValid = false;
                }
            });

            return isValid;
        }

        function showSuccessResult(data) {
            const result = data.predicted_price;
            const input = data.input;

            document.getElementById('resultTitle').textContent = '✓ Predicted Price';
            document.getElementById('resultPrice').textContent = `₹${result.toLocaleString('en-IN')} Lakh`;
            
            const summary = `
                <div class="input-summary-item">
                    <span> Location:</span>
                    <strong>${input.location}</strong>
                </div>
                <div class="input-summary-item">
                    <span> BHK:</span>
                    <strong>${input.bhk}</strong>
                </div>
                <div class="input-summary-item">
                    <span> Area:</span>
                    <strong>${input.total_sqft.toLocaleString()} Sqft</strong>
                </div>
                <div class="input-summary-item">
                    <span> Bathrooms:</span>
                    <strong>${input.bath}</strong>
                </div>
                <div class="input-summary-item">
                    <span> Balcony:</span>
                    <strong>${input.balcony ? 'Yes' : 'No'}</strong>
                </div>
            `;
            
            document.getElementById('inputSummary').innerHTML = summary;

            resultDiv.classList.remove('error');
            resultDiv.classList.add('success');
            resultDiv.style.display = 'block';
        }

        function showErrorResult(errorMessage) {
            document.getElementById('resultTitle').textContent = '✗ Error';
            document.getElementById('resultPrice').textContent = 'Prediction Failed';
            document.getElementById('inputSummary').innerHTML = `<div style="color: inherit;">${errorMessage}</div>`;

            resultDiv.classList.remove('success');
            resultDiv.classList.add('error');
            resultDiv.style.display = 'block';
        }


        ['location', 'bhk', 'total_sqft', 'bath'].forEach(field => {
            document.getElementById(field).addEventListener('change', () => {
                document.getElementById(field).closest('.form-group').classList.remove('error');
            });
        });
    </script>
</body>
</html>
